name: Build GameGuide APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Download and prepare uBlock Origin
        run: |
          mkdir -p app/src/main/assets/ublock
          curl -fL "https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi" -o /tmp/ublock.xpi
          unzip -q /tmp/ublock.xpi -d app/src/main/assets/ublock
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest_path = Path("app/src/main/assets/ublock/manifest.json")
          manifest = json.loads(manifest_path.read_text())
          # GeckoView implements a smaller WebExtension permission schema than Firefox.
          supported = {
              "activeTab", "alarms", "cookies", "dns", "geckoViewAddons",
              "nativeMessagingFromContent", "storage", "unlimitedStorage",
              "webRequest", "webRequestBlocking", "webRequestAuthProvider",
              "webRequestFilterResponse", "webRequestFilterResponse.serviceWorkerScript",
              "idle", "scripting", "mozillaAddons", "activityLog",
              "networkStatus", "telemetry", "contextualIdentities",
              "declarativeNetRequestWithHostAccess", "theme"
          }
          original = manifest.get("permissions", [])
          manifest["permissions"] = [p for p in original if p in supported or p.startswith(("http://", "https://")) or p == "<all_urls>"]
          manifest.pop("commands", None)
          manifest.pop("sidebar_action", None)
          # Keep Gecko-specific identity/version, but remove optional metadata
          # that may not be understood by older embedded GeckoView builds.
          gecko = manifest.get("browser_specific_settings", {}).get("gecko", {})
          gecko.pop("data_collection_permissions", None)
          print("Original uBO permissions:", original)
          print("GeckoView-compatible permissions:", manifest["permissions"])
          manifest_path.write_text(json.dumps(manifest, indent=2))
          PY
      - name: Prepare persistent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing GitHub Actions secret: ANDROID_KEYSTORE_BASE64"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gameguide-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/gameguide-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: gradle --no-daemon assembleRelease
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Verify uBlock locale assets are packaged
        run: |
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -F "assets/ublock/_locales/en/messages.json"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameGuide-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
