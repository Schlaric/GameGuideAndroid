name: Build GameGuide APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Validate reading-position JavaScript
        run: node --check app/src/main/assets/readerposition/reader-position.js
      - name: Download and prepare uBlock Origin
        run: |
          mkdir -p app/src/main/assets/ublock
          curl -fL "https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi" -o /tmp/ublock.xpi
          unzip -q /tmp/ublock.xpi -d app/src/main/assets/ublock
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest_path = Path("app/src/main/assets/ublock/manifest.json")
          manifest = json.loads(manifest_path.read_text())
          # GeckoView implements a smaller WebExtension permission schema than Firefox.
          # Keep the core APIs uBlock Origin needs and that GeckoView implements.
          # GeckoView does not implement the Firefox UI menus API; publicSuffix
          # is optional to uBO's request-blocking path and is omitted here.
          supported = {
              "activeTab", "alarms", "cookies", "dns", "geckoViewAddons",
              "nativeMessagingFromContent", "storage", "unlimitedStorage",
              "tabs", "privacy", "webNavigation", "webRequest",
              "webRequestBlocking", "idle"
          }
          original = manifest.get("permissions", [])
          manifest["permissions"] = [p for p in original if p in supported or p.startswith(("http://", "https://")) or p == "<all_urls>"]
          manifest.pop("commands", None)
          manifest.pop("sidebar_action", None)
          # Keep Gecko-specific identity/version, but remove optional metadata
          # that may not be understood by older embedded GeckoView builds.
          gecko = manifest.get("browser_specific_settings", {}).get("gecko", {})
          gecko.pop("data_collection_permissions", None)
          print("Original uBO permissions:", original)
          print("GeckoView-compatible permissions:", manifest["permissions"])
          required = {"storage", "webRequest", "webRequestBlocking", "<all_urls>"}
          missing = required.difference(manifest["permissions"])
          if missing:
              raise SystemExit(f"Missing critical uBO permissions: {sorted(missing)}")
          manifest_path.write_text(json.dumps(manifest, indent=2))
          PY
      - name: Generate launcher icons from approved GameGuide cover
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Path("gameguide-icon.jpg")
          if not source.is_file():
              raise SystemExit("Approved icon image is missing")
          image = Image.open(source).convert("RGB")
          w, h = image.size
          edge = min(w, h)
          image = image.crop(((w-edge)//2, (h-edge)//2, (w+edge)//2, (h+edge)//2))
          res = Path("app/src/main/res")
          # Remove the previous adaptive launcher resource so Android uses
          # the new full-cover artwork consistently at every density.
          (res / "mipmap-anydpi-v26" / "ic_launcher.xml").unlink(missing_ok=True)
          for density, size in {"mdpi":48, "hdpi":72, "xhdpi":96, "xxhdpi":144, "xxxhdpi":192}.items():
              dest = res / ("mipmap-" + density)
              dest.mkdir(parents=True, exist_ok=True)
              image.resize((size, size), Image.Resampling.LANCZOS).save(dest / "ic_launcher.png")
          print("Generated GameGuide launcher icons from", source)
          PY
      - name: Decode persistent signing key
        env:
          GAMEGUIDE_KEYSTORE_BASE64: ${{ secrets.GAMEGUIDE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$GAMEGUIDE_KEYSTORE_BASE64" ]; then
            echo "::error::Missing GAMEGUIDE_KEYSTORE_BASE64 repository secret"
            exit 1
          fi
          echo "$GAMEGUIDE_KEYSTORE_BASE64" | base64 --decode > gameguide-release.jks
      - name: Build debug APK
        env:
          GAMEGUIDE_KEYSTORE_PASSWORD: ${{ secrets.GAMEGUIDE_KEYSTORE_PASSWORD }}
          GAMEGUIDE_KEY_ALIAS: ${{ secrets.GAMEGUIDE_KEY_ALIAS }}
        run: |
          if [ -z "$GAMEGUIDE_KEYSTORE_PASSWORD" ] || [ -z "$GAMEGUIDE_KEY_ALIAS" ]; then
            echo "::error::Missing one or more GameGuide signing secrets"
            exit 1
          fi
          gradle --no-daemon assembleDebug
      - name: Verify uBlock locale assets are packaged
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F "assets/ublock/_locales/en/messages.json"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameGuide-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GameGuide 2.43 GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.43 >/dev/null 2>&1 && { echo "Release already exists"; exit 0; }
          gh release create v2.43 "app/build/outputs/apk/debug/app-debug.apk#GameGuide-2.43.apk" --target "$GITHUB_SHA" --title "GameGuide 2.43" --notes "GameGuide 2.43 simplifies checkpoint management with Save Checkpoint and My Checkpoints. Existing checkpoints and automatic reading progress are preserved."
